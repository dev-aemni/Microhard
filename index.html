<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Microhard - Memory Game</title>

<!-- Local Favicon -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<!-- Local Tailwind JS -->
<script src="tailwind.min.js"></script>

<!-- Local Offline Outfit Font -->
<link href="font-outfit.css" rel="stylesheet">

<style>
  body {
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    background-color: #080b14;
    background-image: 
      radial-gradient(at 20% 20%, rgba(243, 83, 37, 0.08) 0px, transparent 50%),
      radial-gradient(at 80% 20%, rgba(129, 188, 6, 0.08) 0px, transparent 50%),
      radial-gradient(at 20% 80%, rgba(5, 166, 240, 0.08) 0px, transparent 50%),
      radial-gradient(at 80% 80%, rgba(255, 186, 8, 0.08) 0px, transparent 50%);
    color: #f1f5f9;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* Microsoft Logo Grid Colors & Styles */
  .pad-btn {
    position: relative;
    transition: transform 0.1s ease, filter 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    opacity: 0.72;
    filter: saturate(0.9);
    outline: none;
  }

  .pad-btn:active:not(:disabled), .pad-btn.active {
    opacity: 1;
    filter: saturate(1.8) brightness(1.3);
    transform: scale(0.96);
  }

  /* Top Left - Red */
  .pad-red {
    background: radial-gradient(circle at 30% 30%, #f35325, #b82200);
    box-shadow: 0 4px 0 #7a1500, 0 0 15px rgba(243, 83, 37, 0.25);
  }
  .pad-red.active {
    box-shadow: 0 0 30px #f35325, inset 0 0 15px #ffffff;
  }

  /* Top Right - Green */
  .pad-green {
    background: radial-gradient(circle at 30% 30%, #81bc06, #486e00);
    box-shadow: 0 4px 0 #2f4900, 0 0 15px rgba(129, 188, 6, 0.25);
  }
  .pad-green.active {
    box-shadow: 0 0 30px #81bc06, inset 0 0 15px #ffffff;
  }

  /* Bottom Left - Blue */
  .pad-blue {
    background: radial-gradient(circle at 30% 30%, #05a6f0, #005f9e);
    box-shadow: 0 4px 0 #003861, 0 0 15px rgba(5, 166, 240, 0.25);
  }
  .pad-blue.active {
    box-shadow: 0 0 30px #05a6f0, inset 0 0 15px #ffffff;
  }

  /* Bottom Right - Yellow */
  .pad-yellow {
    background: radial-gradient(circle at 30% 30%, #ffba08, #b58000);
    box-shadow: 0 4px 0 #755200, 0 0 15px rgba(255, 186, 8, 0.25);
  }
  .pad-yellow.active {
    box-shadow: 0 0 30px #ffba08, inset 0 0 15px #ffffff;
  }

  @keyframes pulseSlow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .status-pulse {
    animation: pulseSlow 1.4s infinite ease-in-out;
  }

  .timer-bar {
    transition: width 0.1s linear;
  }
</style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden">

<div class="w-full max-w-sm sm:max-w-md max-h-[96dvh] bg-slate-900/85 border border-slate-800 rounded-2xl sm:rounded-3xl p-3.5 sm:p-6 shadow-2xl backdrop-blur-xl flex flex-col items-center justify-between relative overflow-hidden">
  
  <!-- Header with Microsoft Logo Graphic & Sound Button -->
  <div class="w-full flex items-center justify-between mb-2">
    <div class="flex items-center gap-2">
      <div class="grid grid-cols-2 gap-0.5 w-6 h-6 rounded-sm overflow-hidden p-0.5 bg-slate-950/60 border border-slate-800">
        <div class="bg-[#f35325] rounded-[1px]"></div>
        <div class="bg-[#81bc06] rounded-[1px]"></div>
        <div class="bg-[#05a6f0] rounded-[1px]"></div>
        <div class="bg-[#ffba08] rounded-[1px]"></div>
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-slate-100 via-slate-200 to-slate-400">
        MICROHARD
      </h1>
    </div>

    <!-- Sound Toggle Button -->
    <button id="soundToggle" onclick="toggleSound()" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition cursor-pointer" title="Toggle Sound">
      <svg id="soundOnIcon" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"></path></svg>
      <svg id="soundOffIcon" class="w-4 h-4 sm:w-5 sm:h-5 hidden text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
    </button>
  </div>

  <!-- Live Game Stats Dashboard -->
  <div class="grid grid-cols-4 gap-1.5 w-full mb-2 bg-slate-950/70 p-2 rounded-xl border border-slate-800/80 text-center">
    <div>
      <div class="text-[9px] sm:text-[10px] uppercase tracking-wider text-slate-400 font-bold">Round</div>
      <div id="roundVal" class="text-sm sm:text-base font-bold text-cyan-400">0</div>
    </div>
    <div>
      <div class="text-[9px] sm:text-[10px] uppercase tracking-wider text-slate-400 font-bold">Score</div>
      <div id="scoreVal" class="text-sm sm:text-base font-bold text-emerald-400">0</div>
    </div>
    <div>
      <div class="text-[9px] sm:text-[10px] uppercase tracking-wider text-slate-400 font-bold">Accuracy</div>
      <div id="accuracyVal" class="text-sm sm:text-base font-bold text-amber-400">100%</div>
    </div>
    <div>
      <div class="text-[9px] sm:text-[10px] uppercase tracking-wider text-slate-400 font-bold">Best</div>
      <div id="highScoreVal" class="text-sm sm:text-base font-bold text-purple-400">0</div>
    </div>
  </div>

  <!-- Turn & Game Status Banner -->
  <div class="w-full mb-2">
    <div id="statusBox" class="w-full text-center py-1.5 px-3 rounded-lg font-bold text-xs sm:text-sm transition-all duration-300 bg-slate-800/80 text-slate-300 border border-slate-700">
      Press "Start Game" to begin
    </div>
    <!-- Interactive Timeout Bar -->
    <div class="w-full bg-slate-950 h-1 rounded-full mt-1.5 overflow-hidden border border-slate-800/50">
      <div id="timerBar" class="timer-bar h-full bg-emerald-400 w-0"></div>
    </div>
  </div>

  <!-- Key Helpers Toggle Controls -->
  <div class="w-full flex items-center justify-between bg-slate-950/50 px-3 py-1.5 rounded-lg border border-slate-800/60 mb-2">
    <span class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
      <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
      Show Key Helpers
    </span>
    <button id="keyHelperToggle" onclick="toggleKeyHelpers()" class="relative inline-flex h-5 w-9 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-emerald-500 transition-colors duration-200 ease-in-out focus:outline-none" role="switch" aria-checked="true">
      <span id="toggleKnob" class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-4"></span>
    </button>
  </div>

  <!-- Microsoft Logo Grid Layout: R G (top), B Y (bottom) -->
  <div class="grid grid-cols-2 gap-2.5 sm:gap-3.5 w-full aspect-square max-w-[240px] sm:max-w-[270px] mb-2.5">
    <!-- Top Left: RED -->
    <button id="pad-0" class="pad-btn pad-red rounded-xl sm:rounded-2xl cursor-pointer flex items-start justify-start p-2" onclick="handlePadClick(0)" aria-label="Red Button">
      <span class="key-helper text-[10px] font-extrabold tracking-wider text-white/90 bg-black/40 px-1.5 py-0.5 rounded border border-white/20 shadow-sm">Q / 1</span>
    </button>
    <!-- Top Right: GREEN -->
    <button id="pad-1" class="pad-btn pad-green rounded-xl sm:rounded-2xl cursor-pointer flex items-start justify-end p-2" onclick="handlePadClick(1)" aria-label="Green Button">
      <span class="key-helper text-[10px] font-extrabold tracking-wider text-white/90 bg-black/40 px-1.5 py-0.5 rounded border border-white/20 shadow-sm">W / 2</span>
    </button>
    <!-- Bottom Left: BLUE -->
    <button id="pad-2" class="pad-btn pad-blue rounded-xl sm:rounded-2xl cursor-pointer flex items-end justify-start p-2" onclick="handlePadClick(2)" aria-label="Blue Button">
      <span class="key-helper text-[10px] font-extrabold tracking-wider text-white/90 bg-black/40 px-1.5 py-0.5 rounded border border-white/20 shadow-sm">A / 3</span>
    </button>
    <!-- Bottom Right: YELLOW -->
    <button id="pad-3" class="pad-btn pad-yellow rounded-xl sm:rounded-2xl cursor-pointer flex items-end justify-end p-2" onclick="handlePadClick(3)" aria-label="Yellow Button">
      <span class="key-helper text-[10px] font-extrabold tracking-wider text-white/90 bg-black/40 px-1.5 py-0.5 rounded border border-white/20 shadow-sm">S / 4</span>
    </button>
  </div>

  <!-- Action Button -->
  <div class="w-full">
    <button id="startBtn" onclick="startGame()" class="w-full py-2.5 sm:py-3 px-4 rounded-xl font-extrabold text-sm sm:text-base tracking-wider text-slate-950 bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 hover:from-emerald-300 hover:to-cyan-300 active:scale-95 transition-all duration-150 shadow-md shadow-emerald-500/20 cursor-pointer">
      START GAME
    </button>
  </div>

</div>

<script>
// Web Audio API Synthesizer
let audioCtx = null;
let soundMuted = false;
let showKeyHelpers = true;

// Harmonic frequencies: Red (E4), Green (G4), Blue (C4), Yellow (C5)
const frequencies = [329.63, 392.00, 261.63, 523.25];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function toggleSound() {
  soundMuted = !soundMuted;
  document.getElementById("soundOnIcon").classList.toggle("hidden", soundMuted);
  document.getElementById("soundOffIcon").classList.toggle("hidden", !soundMuted);
}

function toggleKeyHelpers() {
  showKeyHelpers = !showKeyHelpers;
  const toggleBtn = document.getElementById("keyHelperToggle");
  const toggleKnob = document.getElementById("toggleKnob");
  const helperBadges = document.querySelectorAll(".key-helper");

  if (showKeyHelpers) {
    toggleBtn.classList.replace("bg-slate-700", "bg-emerald-500");
    toggleKnob.classList.replace("translate-x-0", "translate-x-4");
    helperBadges.forEach(badge => badge.classList.remove("hidden"));
  } else {
    toggleBtn.classList.replace("bg-emerald-500", "bg-slate-700");
    toggleKnob.classList.replace("translate-x-4", "translate-x-0");
    helperBadges.forEach(badge => badge.classList.add("hidden"));
  }
}

function playTone(index, duration = 300, isError = false) {
  if (soundMuted) return;
  try {
    initAudio();
    if (!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (isError) {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(frequencies[index], audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration / 1000));
      osc.start();
      osc.stop(audioCtx.currentTime + (duration / 1000));
    }
  } catch (e) {
    console.error("Audio playback error", e);
  }
}

let sequence = [];
let userStep = 0;
let isPlaying = false;
let isPlayback = false;
let score = 0;
let totalClicks = 0;
let correctClicks = 0;
let highScore = parseInt(localStorage.getItem("microhard_highscore") || "0", 10);
let round = 0;

let inputTimer = null;
let timerProgressInterval = null;
const TIME_LIMIT_MS = 4000;
let timeRemaining = TIME_LIMIT_MS;

const pads = [
  document.getElementById("pad-0"),
  document.getElementById("pad-1"),
  document.getElementById("pad-2"),
  document.getElementById("pad-3")
];
const statusBox = document.getElementById("statusBox");
const roundVal = document.getElementById("roundVal");
const scoreVal = document.getElementById("scoreVal");
const accuracyVal = document.getElementById("accuracyVal");
const highScoreVal = document.getElementById("highScoreVal");
const startBtn = document.getElementById("startBtn");
const timerBar = document.getElementById("timerBar");

highScoreVal.textContent = highScore;

function setStatus(message, type = 'info') {
  statusBox.className = "w-full text-center py-1.5 px-3 rounded-lg font-bold text-xs sm:text-sm transition-all duration-300 border";
  statusBox.innerHTML = message;

  if (type === 'watch') {
    statusBox.classList.add("bg-amber-500/10", "text-amber-400", "border-amber-500/30", "status-pulse");
  } else if (type === 'turn') {
    statusBox.classList.add("bg-emerald-500/10", "text-emerald-400", "border-emerald-500/30");
  } else if (type === 'error') {
    statusBox.classList.add("bg-rose-500/10", "text-rose-400", "border-rose-500/30");
  } else {
    statusBox.classList.add("bg-slate-800/80", "text-slate-300", "border-slate-700");
  }
}

function updateStatsUI() {
  roundVal.textContent = round;
  scoreVal.textContent = score;
  highScoreVal.textContent = highScore;
  
  const accuracy = totalClicks > 0 ? Math.round((correctClicks / totalClicks) * 100) : 100;
  accuracyVal.textContent = `${accuracy}%`;
}

function activatePad(index, duration = 250) {
  pads[index].classList.add("active");
  playTone(index, duration);
  setTimeout(() => {
    pads[index].classList.remove("active");
  }, duration);
}

function startGame() {
  initAudio();
  sequence = [];
  userStep = 0;
  score = 0;
  round = 0;
  totalClicks = 0;
  correctClicks = 0;
  isPlaying = true;

  startBtn.textContent = "RESTART GAME";
  updateStatsUI();
  nextRound();
}

function nextRound() {
  round++;
  userStep = 0;
  sequence.push(Math.floor(Math.random() * 4));
  updateStatsUI();
  playSequence();
}

function playSequence() {
  isPlayback = true;
  stopTimer();
  setStatus("Watch carefully...", "watch");

  let i = 0;
  const speed = Math.max(250, 550 - (round * 20));
  
  const interval = setInterval(() => {
    activatePad(sequence[i], speed * 0.65);
    i++;
    if (i >= sequence.length) {
      clearInterval(interval);
      setTimeout(() => {
        isPlayback = false;
        setStatus("YOUR TURN!", "turn");
        startTimer();
      }, 300);
    }
  }, speed);
}

function startTimer() {
  stopTimer();
  timeRemaining = TIME_LIMIT_MS;
  timerBar.style.width = "100%";
  
  const updateInterval = 50;
  timerProgressInterval = setInterval(() => {
    timeRemaining -= updateInterval;
    const percentage = Math.max(0, (timeRemaining / TIME_LIMIT_MS) * 100);
    timerBar.style.width = `${percentage}%`;

    if (timeRemaining <= 0) {
      stopTimer();
      handleGameOver("Game Over - Too Slow!");
    }
  }, updateInterval);
}

function stopTimer() {
  clearInterval(timerProgressInterval);
  timerBar.style.width = "0%";
}

function handlePadClick(index) {
  if (!isPlaying || isPlayback) return;

  totalClicks++;

  if (sequence[userStep] === index) {
    activatePad(index, 200);
    correctClicks++;
    
    const timeBonus = Math.floor(timeRemaining / 200);
    score += 10 + (round * 3) + timeBonus;
    
    if (score > highScore) {
      highScore = score;
      localStorage.setItem("microhard_highscore", highScore.toString());
    }
    updateStatsUI();

    userStep++;

    if (userStep === sequence.length) {
      stopTimer();
      isPlayback = true;
      setStatus("Great! Next round...", "turn");
      score += round * 20;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("microhard_highscore", highScore.toString());
      }
      updateStatsUI();
      setTimeout(nextRound, 700);
    } else {
      startTimer();
    }
  } else {
    activatePad(index, 200);
    playTone(0, 500, true);
    stopTimer();
    handleGameOver("Game Over - Wrong Button!");
  }
}

function handleGameOver(reasonMsg) {
  isPlaying = false;
  isPlayback = false;
  stopTimer();

  setStatus(reasonMsg, "error");
  startBtn.textContent = "PLAY AGAIN";
}

window.addEventListener('keydown', (e) => {
  if (!isPlaying || isPlayback) return;

  const key = e.key.toLowerCase();
  
  // Top-Left (Red): Q / 1 / ArrowUp
  if (key === 'q' || key === '1' || key === 'arrowup') handlePadClick(0);
  // Top-Right (Green): W / 2 / ArrowRight
  if (key === 'w' || key === '2' || key === 'arrowright') handlePadClick(1);
  // Bottom-Left (Blue): A / 3 / ArrowLeft
  if (key === 'a' || key === '3' || key === 'arrowleft') handlePadClick(2);
  // Bottom-Right (Yellow): S / 4 / ArrowDown
  if (key === 's' || key === '4' || key === 'arrowdown') handlePadClick(3);
});
</script>

</body>
</html>
